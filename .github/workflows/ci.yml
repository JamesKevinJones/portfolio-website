name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # With CI set, playwright.config.ts builds and serves production first,
      # so this step is also the build check.
      - name: Playwright e2e against a production build
        run: npm run test:e2e
